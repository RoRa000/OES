<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - OES</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container navbar">

            <a
                href="index.html"
                class="logo"
            >
                OES
            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="login.html">
                    Student Login
                </a>

                <a href="register.html">
                    Register
                </a>

            </nav>

        </div>

    </header>



    <!-- ADMIN LOGIN -->

    <main>

        <section class="auth-section">

            <div class="auth-card">


                <!-- HEADER -->

                <div class="auth-header">

                    <div class="auth-icon">
                        👨‍💼
                    </div>


                    <h1>
                        Admin Login
                    </h1>


                    <p>
                        Login to manage examinations,
                        questions and student results.
                    </p>

                </div>



                <!-- FORM -->

                <form id="adminLoginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="adminEmail">
                            Admin Email
                        </label>


                        <input
                            type="email"
                            id="adminEmail"
                            placeholder="Enter admin email"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="adminPassword">
                            Admin Password
                        </label>


                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >

                    </div>



                    <!-- MESSAGE -->

                    <div
                        id="adminLoginMessage"
                        class="form-message"
                    ></div>



                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        🔐 Admin Login
                    </button>


                </form>



                <!-- FOOTER -->

                <div class="auth-footer">

                    <p>
                        Are you a student?
                    </p>


                    <a
                        href="login.html"
                        class="btn btn-secondary"
                    >
                        👨‍🎓 Student Login
                    </a>


                    <br><br>


                    <a
                        href="index.html"
                        class="back-home"
                    >
                        ← Back to Home
                    </a>

                </div>


            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 OES - Online Aptitude Examination System
            </p>

        </div>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="js/auth.js"></script>

    <script src="js/admin-login.js"></script>


</body>

</html>
