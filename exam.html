<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Online Exam - OES</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container navbar">

            <a
                href="dashboard.html"
                class="logo"
            >
                OES
            </a>


            <nav class="nav-links">

                <a href="dashboard.html">
                    Dashboard
                </a>


                <a
                    href="#"
                    id="logoutBtn"
                    class="nav-register"
                >
                    Logout
                </a>

            </nav>

        </div>

    </header>



    <!-- EXAM SECTION -->

    <main>

        <section class="exam-section">

            <div class="container">


                <!-- EXAM HEADER -->

                <div class="exam-header">

                    <div>

                        <span class="dashboard-label">
                            ONLINE EXAMINATION
                        </span>


                        <!-- DYNAMIC EXAM NAME -->

                        <h1 id="examTitle">
                            Loading examination...
                        </h1>


                        <p id="examDescription">
                            Please wait while your examination is loading.
                        </p>

                    </div>



                    <!-- TIMER -->

                    <div class="exam-timer">

                        <span>
                            TIME LEFT
                        </span>


                        <strong id="timer">
                            00:00
                        </strong>

                    </div>

                </div>



                <!-- PROGRESS -->

                <div class="exam-progress">

                    <div class="progress-info">

                        <span>

                            Question

                            <strong id="currentQuestion">
                                1
                            </strong>

                            of

                            <strong id="totalQuestions">
                                0
                            </strong>

                        </span>


                        <span>

                            Answered:

                            <strong id="answeredCount">
                                0
                            </strong>

                        </span>

                    </div>



                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            id="progressFill"
                        ></div>

                    </div>

                </div>



                <!-- QUESTION CARD -->

                <div class="question-card">


                    <div class="question-number">

                        Question

                        <span id="questionNumber">
                            1
                        </span>

                    </div>



                    <h2 id="questionText">

                        Loading question...

                    </h2>



                    <!-- OPTIONS -->

                    <div
                        class="options"
                        id="optionsContainer"
                    >
                    </div>



                    <!-- NAVIGATION -->

                    <div class="question-navigation">


                        <button
                            type="button"
                            id="previousBtn"
                            class="btn btn-secondary"
                        >
                            ← Previous
                        </button>



                        <button
                            type="button"
                            id="nextBtn"
                            class="btn btn-primary"
                        >
                            Next →
                        </button>


                    </div>

                </div>



                <!-- QUESTION PALETTE -->

                <div class="question-palette-card">


                    <h3>
                        Question Palette
                    </h3>



                    <div
                        class="question-palette"
                        id="questionPalette"
                    >
                    </div>



                    <div class="palette-legend">


                        <span>

                            <i class="legend-box answered"></i>

                            Answered

                        </span>



                        <span>

                            <i class="legend-box current"></i>

                            Current

                        </span>



                        <span>

                            <i class="legend-box unvisited"></i>

                            Unvisited

                        </span>


                    </div>

                </div>



                <!-- SUBMIT -->

                <div class="exam-submit-section">


                    <button
                        type="button"
                        id="submitExamBtn"
                        class="btn btn-primary submit-exam-btn"
                    >
                        Submit Examination
                    </button>


                </div>


            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 OES - Online Aptitude Examination System
            </p>

        </div>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="js/auth.js"></script>

    <script src="js/exam.js"></script>


</body>

</html>
