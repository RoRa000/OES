<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Registration - OES</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container navbar">

            <a
                href="index.html"
                class="logo"
            >
                OES
            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </div>

    </header>



    <!-- STUDENT REGISTRATION -->

    <main>

        <section class="auth-section">

            <div class="auth-card">


                <!-- HEADER -->

                <div class="auth-header">

                    <div class="auth-icon">
                        🎓
                    </div>


                    <span
                        style="
                            display:inline-block;
                            background:#064e3b;
                            color:#34d399;
                            padding:6px 12px;
                            border-radius:20px;
                            font-size:12px;
                            font-weight:700;
                            margin-bottom:12px;
                        "
                    >
                        STUDENT REGISTRATION
                    </span>


                    <h1>
                        Create Student Account
                    </h1>


                    <p>
                        Register as a student and start your
                        examination journey.
                    </p>

                </div>



                <!-- FORM -->

                <form id="registerForm">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="registerEmail"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- MOBILE -->

                    <div class="form-group">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter 10-digit mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            inputmode="numeric"
                            autocomplete="tel"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            name="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- MESSAGE -->

                    <div
                        id="registerMessage"
                        class="form-message"
                    ></div>



                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Create Student Account
                    </button>


                </form>



                <!-- LOGIN -->

                <div class="auth-footer">

                    <p>

                        Already have a student account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>


                    <a
                        href="index.html"
                        class="back-home"
                    >
                        ← Back to Home
                    </a>

                </div>


            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 OES - Online Aptitude Examination System
            </p>

        </div>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="js/auth.js"></script>

    <script src="js/register.js"></script>


</body>

</html>
